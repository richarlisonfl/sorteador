<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f4ef">
  <title>Sorteador de jogos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div>
        <p class="eyebrow">ORGANIZAÇÃO DE PARTIDAS</p>
        <h1>Sorteador de jogos</h1>
      </div>
    </header>

    <section class="actions" aria-label="Opções de sorteio">
      <button class="action-button action-button--all" id="draw-all" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 5h14v14H5z" />
          <path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01" />
        </svg>
        <span>Sortear todos</span>
      </button>
      <button class="action-button action-button--one" id="draw-one" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 6h16M4 12h10M4 18h7" />
          <path d="m17 15 3 3-3 3" />
        </svg>
        <span>Sortear um a um</span>
      </button>
    </section>
    <p class="status" id="draw-status" aria-live="polite"></p>

    <section aria-labelledby="teams-title">
      <div class="table-heading">
        <h2 id="teams-title">Equipes e turmas</h2>
        <span class="team-count" id="team-count"></span>
      </div>
      <div class="table-scroll" role="region" aria-label="Tabela de equipes e turmas" tabindex="0">
        <table>
          <thead>
            <tr id="teams-header"></tr>
          </thead>
          <tbody id="teams-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
